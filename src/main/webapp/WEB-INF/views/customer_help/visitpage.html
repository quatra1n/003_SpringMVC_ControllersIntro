<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hello — Customer Help</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap');
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{--cream:#FAF8F4;--ink:#1C1917;--ink-soft:#57534E;--ink-faint:#A8A29E;--border:rgba(28,25,23,.10);--border-mid:rgba(28,25,23,.18);--accent:#C4763A;--accent-light:#F5EDE3;--serif:'Cormorant Garamond',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif}
        html{font-size:16px}
        body{background:var(--cream);color:var(--ink);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.5rem}
        .page{width:100%;max-width:560px;animation:fade-up .55s cubic-bezier(.22,1,.36,1) both}
        @keyframes fade-up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
        .eyebrow{font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:1.5rem;display:flex;align-items:center;gap:8px}
        .eyebrow::before{content:'';display:block;width:24px;height:1px;background:var(--accent)}
        h1{font-family:var(--serif);font-size:clamp(2.4rem,7vw,3.6rem);font-weight:300;line-height:1.15;color:var(--ink);margin-bottom:1.25rem;letter-spacing:-.01em}
        h1 em{font-style:italic;font-weight:300;color:var(--ink-soft)}
        .body-text{font-size:15px;font-weight:300;line-height:1.8;color:var(--ink-soft);margin-bottom:2rem;max-width:420px}
        .rule{width:100%;height:.5px;background:var(--border);margin:2rem 0}
        .btn-row{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:2rem}
        .btn-primary{display:inline-flex;align-items:center;gap:10px;font-size:12.5px;font-weight:500;letter-spacing:.10em;text-transform:uppercase;text-decoration:none;color:var(--cream);background:var(--ink);padding:.9rem 2rem;border-radius:2px;transition:background .2s}
        .btn-primary:hover{background:var(--accent)}
        .btn-primary .arr{transition:transform .2s}
        .btn-primary:hover .arr{transform:translateX(5px)}
        .link-sec{font-size:12.5px;font-weight:400;color:var(--ink-faint);text-decoration:none;border-bottom:.5px solid var(--border-mid);padding-bottom:2px;transition:color .18s,border-color .18s;letter-spacing:.04em}
        .link-sec:hover{color:var(--ink);border-color:var(--ink)}
        .deco{position:fixed;bottom:2rem;right:2.5rem;font-family:var(--serif);font-style:italic;font-size:72px;line-height:1;color:var(--ink);opacity:.04;pointer-events:none;user-select:none}
    </style>
</head>
<body>
<div class="deco">✦</div>
<div class="page">
    <p class="eyebrow">Welcome</p>
    <h1>Have a<br><em>question?</em></h1>
    <p class="body-text">Browse our knowledge base or reach out to our support team directly — whatever feels easier for you.</p>

    <div class="btn-row">
        <a class="btn-primary" href="/customer_help/faq">FAQ <span class="arr">→</span></a>
        <a class="btn-primary" href="/customer_help/support">Contact support <span class="arr">→</span></a>
    </div>

    <div class="rule"></div>

    <p class="body-text" style="margin-bottom:0;font-size:14px">
        Would you like to leave feedback? We're always open to improvements — <a href="/customer_care/feedback" style="color:var(--ink);font-weight:400;text-decoration:none;border-bottom:.5px solid var(--border-mid);transition:color .18s">share your thoughts</a>.
    </p>
</div>
</body>
</html>
